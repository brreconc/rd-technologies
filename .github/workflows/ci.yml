name: CI

# Pipeline de calidad (§13/§16). Ejecuta typecheck, lint, tests unitarios,
# build, E2E (Chromium) y valida que la imagen Docker se construye.
# El PM puede extender el job `docker` para PUBLICAR la imagen en su registro.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod

  e2e:
    name: E2E · Responsive · A11y (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegador (Chromium + libs del sistema)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rd-technologies:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.rdtechnologies.com
            NEXT_PUBLIC_SITE_INDEXABLE=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Para PUBLICAR en un registro, el PM añade aquí docker/login-action +
      # docker/build-push-action con push:true y sus credenciales (secrets).
