name: CI

# Pipeline de calidad (§13/§16). Ejecuta typecheck, lint, tests unitarios,
# build, E2E (Chromium) y valida que la imagen Docker se construye.
# El PM puede extender el job `docker` para PUBLICAR la imagen en su registro.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod

  e2e:
    name: E2E · Responsive · A11y (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegador (Chromium + libs del sistema)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Playwright
        run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imagen Docker (build + publicación en GHCR)
    runs-on: ubuntu-latest
    needs: quality
    # `packages: write` es lo único que necesita GITHUB_TOKEN para publicar en
    # GHCR: no hacen falta secretos adicionales ni un PAT.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # En pull requests solo se construye (validación); en `main` se publica.
      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera los tags/labels. Normaliza el nombre a minúsculas (GHCR lo exige
      # y los usuarios de GitHub pueden tener mayúsculas).
      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # ⚠️ Las NEXT_PUBLIC_* se hornean en el bundle durante `next build`, así que
      # van como build-args. Por defecto la imagen se construye para ejecutarse
      # en LOCAL (localhost + noindex), que es lo que hace falta para que otra
      # persona la levante y revise el proyecto sin configurar nada.
      # Cuando exista el dominio real, se definen en Settings → Secrets and
      # variables → Actions → Variables: SITE_URL y SITE_INDEXABLE.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_SITE_INDEXABLE=${{ vars.SITE_INDEXABLE || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
