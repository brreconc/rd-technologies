# Aprobación de scripts de build (pnpm >= 11). Ambas son dependencias de
# confianza: sharp (next/image) y unrs-resolver (resolver de módulos).
allowBuilds:
  sharp: true
  unrs-resolver: true

# Overrides de seguridad (Fase 6). En pnpm 11 los overrides viven aquí, no en
# package.json. Se fuerza postcss (transitiva de Next) a la línea parcheada
# frente a GHSA-qx2v-qp2m-jg93 (XSS en el stringify de CSS) y, desde la Fase 10,
# a GHSA-r28c-9q8g-f849 (path traversal al auto-cargar el source map previo vía
# `sourceMappingURL`, que expone ficheros .map arbitrarios). postcss solo se usa
# en build, pero el aviso es "high" y el salto es de parche. Ver docs/05-security.
overrides:
  postcss@<8.5.18: ">=8.5.18"
  # sharp arrastra los CVE de libvips CVE-2026-33327/33328/35590/35591
  # (GHSA-f88m-g3jw-g9cj), parcheados en 0.35. Next lo declara como dependencia
  # OPCIONAL (^0.34.5) y solo lo usa el optimizador de `next/image`, que este
  # proyecto no utiliza (no hay imágenes rasterizadas; `public/` son SVG) — de
  # hecho sharp ni siquiera entra en la salida standalone que forma la imagen
  # Docker. Se fuerza igualmente la línea parcheada para no arrastrar el aviso
  # en el árbol de dependencias. Ver docs/05-security.
  sharp@<0.35.0: ">=0.35.0"
