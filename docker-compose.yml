# ============================================================================
# R&D Technologies — Orquestación de la imagen de producción.
# ============================================================================
# Uso rápido:
#   1) cp .env.production.example .env   (y rellenar valores reales)
#   2) docker compose up -d --build
#
# Compose lee automáticamente el fichero `.env` de esta carpeta para sustituir
# las variables ${...} de abajo. Ver docs/10-deployment/future-deployment.md.
# ----------------------------------------------------------------------------
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # BUILD-TIME (se hornean en el bundle): deben estar en el build.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-false}
    image: rd-technologies:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # RUNTIME (servidor): también se expone la URL para el render de servidor.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NODE_ENV: production
      # SECRETOS de servidor (opcionales; sin ellos, el formulario usa el canal
      # de log local). Rellenar en `.env` cuando se integre el email real.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
